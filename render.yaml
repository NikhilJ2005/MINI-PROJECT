# Render Blueprint — deploys both backend and frontend as web services
# Usage: Connect your GitHub repo to Render and select this file

services:
  # --- Backend (FastAPI + ML) ---
  - type: web
    name: resume-analyzer-api
    runtime: python
    region: oregon
    rootDir: resume-skill-gap-analyzer/backend
    buildCommand: |
      pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  # --- Frontend (React + Vite) ---
  - type: web
    name: resume-analyzer-frontend
    runtime: static
    region: oregon
    rootDir: resume-skill-gap-analyzer/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
